<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HH 英文默書溫習助手</title>
    <meta name="description" content="HH English Dictation Practice App for Primary School Students">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-light: #a5b4fc; --primary-dark: #4f46e5;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --bg: linear-gradient(145deg, #eef2ff 0%, #faf5ff 50%, #f0fdf4 100%);
            --card: #ffffff; --text: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
            --border: #e2e8f0; --r: 16px; --r-sm: 10px;
            --shadow: 0 4px 24px rgba(99,102,241,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',-apple-system,'Microsoft JhengHei',sans-serif; background:var(--bg); min-height:100vh; color:var(--text); padding-bottom:80px; }
        .app-header { text-align:center; padding:20px 16px 12px; }
        .app-header h1 { font-size:18px; font-weight:700; background:linear-gradient(135deg,var(--primary),#a855f7); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        .app-header p { font-size:11px; color:var(--text-3); margin-top:2px; }
        .view { display:none; max-width:600px; margin:0 auto; padding:0 12px; }
        .view.active { display:block; animation:fadeIn 0.3s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; justify-content:center; padding:8px 0 max(8px,env(safe-area-inset-bottom)); z-index:100; }
        .nav-btn { flex:1; max-width:120px; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; padding:6px 12px; font-size:10px; color:var(--text-3); cursor:pointer; font-family:inherit; font-weight:600; transition:all 0.2s; }
        .nav-btn .icon { font-size:22px; }
        .nav-btn.active { color:var(--primary); }
        .nav-btn.active .icon { transform:scale(1.15); }
        .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); border:1px solid rgba(99,102,241,0.08); overflow:hidden; }
        .progress-section { padding:16px; background:linear-gradient(135deg,#eef2ff,#f5f3ff); border-bottom:1px solid var(--border); }
        .progress-info { display:flex; justify-content:space-between; margin-bottom:6px; }
        .progress-info span { font-size:11px; font-weight:700; color:var(--primary); }
        .progress-track { height:5px; background:#e0e7ff; border-radius:10px; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),#a855f7); border-radius:10px; transition:width 0.5s ease; width:0%; }
        .word-card-inner { padding:32px 20px; text-align:center; }
        .card-label { font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px; }
        .word-emoji { font-size:48px; margin-bottom:8px; }
        .word-zh { font-size:32px; font-weight:800; color:var(--text); }
        .speak-btn { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border:none; padding:10px 24px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; margin:20px 0 24px; box-shadow:0 4px 16px rgba(99,102,241,0.3); transition:all 0.2s; }
        .speak-btn:hover { transform:translateY(-1px); }
        .speak-btn:active { transform:scale(0.97); }
        .input-area { display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-bottom:20px; }
        .letter-input { width:38px; height:48px; text-align:center; font-size:22px; font-weight:700; font-family:'Inter',monospace; border:2.5px solid var(--border); border-radius:var(--r-sm); background:#fff; color:var(--text); text-transform:lowercase; transition:all 0.2s; -webkit-appearance:none; appearance:none; outline:none; }
        .letter-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,0.15); }
        .letter-input.correct { background:#fef3c7; border-color:#f59e0b; color:#92400e; }
        .word-space { width:16px; }
        .hint-btn { background:none; border:1px dashed var(--border); color:var(--text-3); padding:6px 16px; border-radius:20px; font-size:12px; cursor:pointer; font-family:inherit; transition:all 0.2s; }
        .hint-btn:hover { border-color:var(--warning); color:var(--warning); }
        .success-msg { color:var(--success); font-weight:700; font-size:18px; animation:bounceIn 0.5s ease; }
        @keyframes bounceIn { 0%{transform:scale(0.5);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
        .hidden { display:none!important; }
        .funfact-box { margin-top:16px; padding:16px; background:linear-gradient(135deg,#f0fdf4,#ecfdf5); border:1px solid #bbf7d0; border-radius:var(--r-sm); text-align:left; animation:fadeIn 0.4s ease; }
        .funfact-title { font-size:15px; font-weight:700; color:#166534; margin-bottom:10px; }
        .funfact-item { display:flex; gap:8px; margin-bottom:8px; font-size:13px; line-height:1.5; }
        .funfact-item .ff-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
        .funfact-item .ff-text { color:var(--text); }
        .funfact-item .ff-zh { color:var(--text-3); font-size:11px; }
        .funfact-related { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
        .funfact-related .fr-tag { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; background:#fff; border:1px solid #bbf7d0; border-radius:16px; font-size:12px; font-weight:600; color:#166534; cursor:pointer; transition:all 0.2s; }
        .funfact-related .fr-tag:hover { background:#dcfce7; }
        .funfact-related .fr-tag .fr-zh { font-weight:400; color:var(--text-3); font-size:10px; }
        .funfact-tip { margin-top:10px; padding:10px 12px; background:#fff; border-radius:8px; font-size:12px; color:var(--text-2); border-left:3px solid var(--success); }
        .funfact-loading { text-align:center; padding:12px; color:var(--text-3); font-size:12px; }
        .nav-buttons { display:flex; justify-content:space-between; padding:16px; background:#f8fafc; border-top:1px solid var(--border); }
        .nav-buttons button { padding:10px 24px; border-radius:var(--r-sm); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; border:none; transition:all 0.2s; }
        .btn-prev { background:#fff; color:var(--text-2); border:1px solid var(--border)!important; }
        .btn-prev:hover { background:#f1f5f9; }
        .btn-prev:disabled { opacity:0.3; cursor:default; }
        .btn-next { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 4px 12px rgba(99,102,241,0.3); }
        .btn-next:hover { transform:translateY(-1px); }
        .completion-screen { padding:40px 20px; text-align:center; }
        .completion-screen h2 { font-size:28px; margin-bottom:12px; }
        .completion-screen p { color:var(--text-2); }
        .restart-btn { margin-top:20px; padding:12px 32px; background:var(--primary); color:#fff; border:none; border-radius:var(--r-sm); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
        .details-card { margin-bottom:16px; }
        .details-header { padding:24px 20px; text-align:center; background:linear-gradient(135deg,#eef2ff,#faf5ff); }
        .details-header .emoji { font-size:48px; }
        .details-header .en { font-size:28px; font-weight:800; color:var(--text); margin:4px 0; cursor:pointer; }
        .details-header .zh { font-size:18px; color:var(--text-2); }
        .details-header .pos { display:inline-block; margin-top:8px; padding:4px 14px; background:var(--primary); color:#fff; border-radius:20px; font-size:11px; font-weight:600; }
        .details-section { padding:16px 20px; border-top:1px solid var(--border); }
        .details-section h3 { font-size:13px; font-weight:700; color:var(--primary); margin-bottom:10px; }
        .detail-tag { display:inline-flex; align-items:center; gap:4px; padding:6px 14px; background:#f1f5f9; border-radius:20px; font-size:13px; color:var(--text); margin:3px; cursor:pointer; transition:all 0.2s; border:1px solid transparent; }
        .detail-tag:hover { background:#e0e7ff; border-color:var(--primary-light); }
        .detail-tag .tag-zh { font-size:11px; color:var(--text-3); }
        .detail-example { background:#f8fafc; padding:12px 16px; border-radius:var(--r-sm); font-size:14px; line-height:1.6; }
        .detail-example .example-zh { color:var(--text-2); font-size:13px; margin-top:4px; }
        .details-nav { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#f8fafc; border-top:1px solid var(--border); }
        .details-nav button { padding:8px 20px; border-radius:var(--r-sm); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; border:1px solid var(--border); background:#fff; color:var(--text-2); }
        .details-nav button:disabled { opacity:0.3; }
        .details-nav .counter { font-size:12px; color:var(--text-3); font-weight:600; }
        .fetch-btn { display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:8px 20px; background:#fff; border:1px dashed var(--primary-light); color:var(--primary); border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
        .fetch-btn:hover { background:#eef2ff; }
        .no-details { padding:40px 20px; text-align:center; color:var(--text-3); }
        .manage-section { margin-bottom:16px; }
        .manage-section .section-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .manage-pad { padding:16px; }
        .admin-row { display:flex; gap:8px; margin-bottom:8px; }
        .admin-row input { flex:1; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--r-sm); font-size:13px; font-family:inherit; outline:none; }
        .admin-row input:focus { border-color:var(--primary); }
        .admin-row button { padding:10px 16px; background:var(--primary); color:#fff; border:none; border-radius:var(--r-sm); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
        .admin-note { font-size:11px; color:var(--text-3); line-height:1.5; }
        .admin-badge { display:inline-block; padding:3px 10px; background:#dcfce7; color:#166534; border-radius:12px; font-size:11px; font-weight:600; }
        .word-list-area { max-height:400px; overflow-y:auto; }
        .word-row { display:flex; align-items:center; padding:10px 16px; border-bottom:1px solid #f1f5f9; gap:8px; }
        .word-row:hover { background:#fafafe; }
        .word-row .wr-en { flex:1; font-weight:600; font-size:14px; }
        .word-row .wr-zh { color:var(--text-2); font-size:13px; min-width:60px; }
        .word-row .wr-em { font-size:20px; min-width:28px; text-align:center; }
        .word-row .wr-del { background:none; border:none; color:var(--text-3); cursor:pointer; font-size:18px; padding:4px 8px; border-radius:6px; }
        .word-row .wr-del:hover { background:#fef2f2; color:var(--danger); }
        .add-word-area { padding:16px; }
        .add-row { display:flex; gap:8px; margin-bottom:8px; }
        .add-row input { flex:1; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--r-sm); font-size:13px; font-family:inherit; outline:none; }
        .add-row input:focus { border-color:var(--primary); }
        .add-row button { padding:10px 16px; background:var(--success); color:#fff; border:none; border-radius:var(--r-sm); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
        .batch-area { margin-top:12px; }
        .batch-area textarea { width:100%; min-height:80px; padding:10px; border:1.5px solid var(--border); border-radius:var(--r-sm); font-size:13px; font-family:inherit; resize:vertical; outline:none; }
        .batch-area textarea:focus { border-color:var(--primary); }
        .batch-area button { margin-top:8px; width:100%; padding:10px; background:var(--primary); color:#fff; border:none; border-radius:var(--r-sm); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
        .export-area { padding:16px; display:flex; gap:8px; flex-wrap:wrap; }
        .export-area button { flex:1; padding:10px; border:1.5px solid var(--border); background:#fff; border-radius:var(--r-sm); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--text-2); }
        .export-area button:hover { background:#f8fafc; border-color:var(--primary-light); }
        .word-count { text-align:center; padding:8px; font-size:11px; color:var(--text-3); background:#f8fafc; }
        .toast-container { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .toast { padding:12px 24px; border-radius:var(--r-sm); font-size:13px; font-weight:600; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,0.15); animation:toastIn 0.3s ease; white-space:nowrap; }
        .toast.success { background:var(--success); }
        .toast.error { background:var(--danger); }
        .toast.info { background:var(--primary); }
        @keyframes toastIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; }
        .spinner.dark { border-color:rgba(0,0,0,0.1); border-top-color:var(--primary); }
        @keyframes spin { to{transform:rotate(360deg)} }
        .loading-overlay { display:flex; align-items:center; justify-content:center; padding:60px; color:var(--text-3); gap:10px; font-size:14px; }

        /* Test View */
        .test-start { padding:40px 20px; text-align:center; }
        .test-start h2 { font-size:22px; margin-bottom:8px; }
        .test-start p { color:var(--text-2); font-size:13px; margin-bottom:24px; }
        .test-start-btn { padding:14px 40px; background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:none; border-radius:var(--r-sm); font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 16px rgba(239,68,68,0.3); transition:all 0.2s; }
        .test-start-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(239,68,68,0.4); }
        .test-timer { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:linear-gradient(135deg,#fef2f2,#fff1f2); border-bottom:1px solid #fecaca; }
        .test-timer .timer-clock { font-size:18px; font-weight:800; color:#dc2626; font-variant-numeric:tabular-nums; }
        .test-timer .timer-progress { font-size:12px; font-weight:700; color:#ef4444; }
        .test-submit-btn { padding:10px 28px; background:linear-gradient(135deg,#ef4444,#dc2626); color:#fff; border:none; border-radius:var(--r-sm); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
        .test-skip-btn { padding:10px 28px; background:#fff; color:var(--text-2); border:1px solid var(--border); border-radius:var(--r-sm); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
        .result-score { text-align:center; padding:20px; }
        .result-score .big-score { font-size:56px; font-weight:800; }
        .result-score .big-score.perfect { color:var(--success); }
        .result-score .big-score.good { color:#f59e0b; }
        .result-score .big-score.poor { color:var(--danger); }
        .result-score .score-label { font-size:14px; color:var(--text-2); margin-top:4px; }
        .result-stat { display:flex; gap:8px; padding:0 20px 16px; }
        .result-stat .stat-box { flex:1; text-align:center; padding:12px; background:#f8fafc; border-radius:var(--r-sm); }
        .result-stat .stat-val { font-size:20px; font-weight:800; color:var(--text); }
        .result-stat .stat-lbl { font-size:10px; color:var(--text-3); font-weight:600; margin-top:2px; }
        .error-item { padding:12px 20px; border-top:1px solid var(--border); }
        .error-word-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .error-word-row .err-zh { font-size:12px; color:var(--text-3); }
        .error-letters { display:flex; gap:3px; flex-wrap:wrap; }
        .error-letters .el { width:28px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:16px; font-weight:700; }
        .error-letters .el.ok { background:#dcfce7; color:#166534; }
        .error-letters .el.wrong { background:#fef2f2; color:#dc2626; text-decoration:line-through; }
        .error-letters .el.correct-show { background:#dbeafe; color:#1e40af; font-size:10px; }
        .error-letters .el.space { width:12px; }
        .history-item { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .history-item .hi-date { font-size:12px; color:var(--text-2); }
        .history-item .hi-score { font-weight:700; font-size:14px; }
        .history-item .hi-score.perfect { color:var(--success); }
        .history-item .hi-score.good { color:#f59e0b; }
        .history-item .hi-score.poor { color:var(--danger); }
        .history-item .hi-time { font-size:11px; color:var(--text-3); }

        @media(min-width:640px) { .letter-input { width:44px; height:54px; font-size:24px; } .word-zh { font-size:36px; } }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>HH 英文默書溫習助手</h1>
        <p>English Dictation Practice</p>
    </header>

    <section id="practice-view" class="view active">
        <div class="card">
            <div class="progress-section">
                <div class="progress-info"><span id="progress-text">Loading...</span><span id="progress-pct"></span></div>
                <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
            </div>
            <div id="word-card" class="word-card-inner"><div class="loading-overlay"><span class="spinner dark"></span> Loading words...</div></div>
            <div id="practice-nav" class="nav-buttons">
                <button class="btn-prev" id="prev-btn" onclick="prevWord()">◀ 上一個</button>
                <button class="btn-next" id="next-btn" onclick="nextWord()">下一個 ▶</button>
            </div>
        </div>
    </section>

    <section id="details-view" class="view">
        <div id="details-content" class="card details-card"></div>
    </section>

    <section id="manage-view" class="view">
        <div class="card manage-section">
            <div class="manage-pad">
                <div class="section-title">🔐 Admin</div>
                <div id="admin-status"></div>
                <div id="admin-login">
                    <div class="admin-row">
                        <input type="password" id="admin-pw" placeholder="Enter admin password..." onkeydown="if(event.key==='Enter')loginAdmin()">
                        <button onclick="loginAdmin()">Login</button>
                    </div>
                    <div class="admin-note">⚠️ Admin access required to add/remove words</div>
                </div>
            </div>
        </div>
        <div class="card manage-section">
            <div style="padding:16px 16px 8px"><div class="section-title">📝 生字列表</div></div>
            <div class="word-count" id="word-count"></div>
            <div class="word-list-area" id="word-list-area"></div>
            <div class="add-word-area" id="admin-controls" style="display:none">
                <div class="section-title" style="font-size:13px">➕ 新增生字</div>
                <div class="add-row">
                    <input type="text" id="add-word-input" placeholder="Type English word and press Enter..." onkeydown="if(event.key==='Enter')addWord()">
                    <button onclick="addWord()">Add</button>
                </div>
                <div class="batch-area">
                    <details>
                        <summary style="font-size:12px;color:var(--text-3);cursor:pointer;margin-bottom:8px">📋 Batch add (one word per line)</summary>
                        <textarea id="batch-input" placeholder="witness&#10;burglar&#10;victim"></textarea>
                        <button onclick="batchAdd()">Batch Add All</button>
                    </details>
                </div>
            </div>
        </div>
        <div class="card manage-section" id="admin-tools" style="display:none">
            <div class="export-area">
                <button onclick="retranslateAll()" style="flex-basis:100%;background:var(--primary);color:#fff;border-color:var(--primary)">🔄 Re-translate All (AI)</button>
                <button onclick="exportWords()">📤 Export JSON</button>
                <button onclick="document.getElementById('import-file').click()">📥 Import JSON</button>
                <input type="file" id="import-file" accept=".json" style="display:none" onchange="importWords(event)">
            </div>
        </div>
    </section>

    <section id="test-view" class="view">
        <div id="test-content" class="card"></div>
        <div id="test-history-card" class="card manage-section" style="margin-top:16px">
            <div style="padding:16px 16px 8px"><div class="section-title">📊 默書記錄</div></div>
            <div id="test-history-list"></div>
        </div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-view="practice" onclick="switchView('practice')"><span class="icon">📝</span><span>練習</span></button>
        <button class="nav-btn" data-view="test" onclick="switchView('test')"><span class="icon">📋</span><span>默書</span></button>
        <button class="nav-btn" data-view="details" onclick="switchView('details')"><span class="icon">📖</span><span>詞彙</span></button>
        <button class="nav-btn" data-view="manage" onclick="switchView('manage')"><span class="icon">⚙️</span><span>管理</span></button>
    </nav>
    <div class="toast-container" id="toast-container"></div>

    <script>
    /* ===== State ===== */
    let words = [];
    let currentIdx = 0;
    let adminPw = localStorage.getItem('hh_admin_pw') || '';
    let isAdmin = false;

    /* Test state */
    let testActive = false;
    let testIdx = 0;
    let testAnswers = [];
    let testTimer = null;
    let testSeconds = 0;
    let testHistory = JSON.parse(localStorage.getItem('hh_test_history') || '[]');

    /* ===== Init ===== */
    async function init() {
        await loadWords();
        if (adminPw) await verifyAdmin(true);
        renderPractice();
        updateAdminUI();
    }

    async function loadWords() {
        try {
            const res = await fetch('/api/words');
            if (!res.ok) throw new Error('Failed to load');
            words = await res.json();
        } catch (e) {
            console.error('Load failed, using fallback:', e);
            words = [];
            toast('⚠️ Could not load words from server', 'error');
        }
    }

    async function saveWordsToServer() {
        if (!adminPw) { toast('Please login as admin first', 'error'); return false; }
        try {
            const res = await fetch('/api/words', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPw, words })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Save failed');
            return true;
        } catch (e) {
            toast('Save failed: ' + e.message, 'error');
            return false;
        }
    }

    /* ===== Admin ===== */
    async function loginAdmin() {
        const pw = document.getElementById('admin-pw').value.trim();
        if (!pw) return;
        adminPw = pw;
        await verifyAdmin(false);
    }

    async function verifyAdmin(silent) {
        try {
            const res = await fetch('/api/words', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPw, action: 'verify' })
            });
            const data = await res.json();
            if (res.ok && data.verified) {
                isAdmin = true;
                localStorage.setItem('hh_admin_pw', adminPw);
                if (!silent) toast('✅ Admin login successful');
            } else {
                isAdmin = false;
                adminPw = '';
                localStorage.removeItem('hh_admin_pw');
                if (!silent) toast('❌ ' + (data.error || 'Login failed'), 'error');
            }
        } catch (e) {
            if (!silent) toast('Connection error: ' + e.message, 'error');
        }
        updateAdminUI();
    }

    function updateAdminUI() {
        const status = document.getElementById('admin-status');
        const login = document.getElementById('admin-login');
        const controls = document.getElementById('admin-controls');
        const tools = document.getElementById('admin-tools');
        if (isAdmin) {
            status.innerHTML = '<span class="admin-badge">✅ Admin</span>';
            login.style.display = 'none';
            controls.style.display = 'block';
            tools.style.display = 'block';
        } else {
            status.innerHTML = '';
            login.style.display = 'block';
            controls.style.display = 'none';
            tools.style.display = 'none';
        }
    }

    /* ===== Navigation ===== */
    function switchView(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(name + '-view').classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
        if (name === 'details') renderDetails();
        if (name === 'manage') renderManageList();
        if (name === 'test' && !testActive) renderTestStart();
    }

    /* ===== Practice ===== */
    function renderPractice() {
        const card = document.getElementById('word-card');
        const nav = document.getElementById('practice-nav');
        nav.style.display = 'flex';
        if (words.length === 0) {
            card.innerHTML = '<div style="padding:40px;color:var(--text-3)">沒有生字，請到管理頁面新增。</div>';
            updateProgress(); return;
        }
        const w = words[currentIdx];
        card.innerHTML = `
            <div class="card-label">溫習生字</div>
            <div><div class="word-emoji">${w.emoji||'📝'}</div><div class="word-zh">${w.zh||'?'}</div></div>
            <button class="speak-btn" onclick="speak('${esc(w.en)}')">🔊 聽發音</button>
            <div class="input-area" id="input-area">${genInputs(w.en)}</div>
            <button class="hint-btn" onclick="giveHint()">💡 提示</button>
            <div id="success-msg" class="success-msg hidden">太棒了！答對了！ ✨</div>
            <div id="funfact-area"></div>`;
        setTimeout(() => { const f = card.querySelector('input'); if(f) f.focus(); }, 200);
        updateProgress();
        updateNavBtns();
    }

    function esc(s) { return s.replace(/'/g, "\\'"); }

    function genInputs(word) {
        return word.split('').map(c => c === ' '
            ? '<div class="word-space"></div>'
            : `<input type="text" maxlength="1" class="letter-input" data-letter="${c.toLowerCase()}" oninput="checkLetter(this)" onkeydown="handleKey(event,this)">`
        ).join('');
    }

    function checkLetter(el) {
        if (el.value.toLowerCase() === el.dataset.letter) {
            el.classList.add('correct');
            let next = el.nextElementSibling;
            while(next && next.tagName !== 'INPUT') next = next.nextElementSibling;
            if (next) next.focus();
        } else { el.classList.remove('correct'); }
        if ([...document.querySelectorAll('#input-area input')].every(i => i.classList.contains('correct'))) {
            document.getElementById('success-msg').classList.remove('hidden');
            speak(words[currentIdx].en);
            loadFunFact(currentIdx);
        }
    }

    function handleKey(e, el) {
        if (e.key === 'Backspace' && el.value === '') {
            let prev = el.previousElementSibling;
            while(prev && prev.tagName !== 'INPUT') prev = prev.previousElementSibling;
            if (prev) { prev.focus(); prev.value = ''; prev.classList.remove('correct'); }
            e.preventDefault();
        }
    }

    async function loadFunFact(idx) {
        const area = document.getElementById('funfact-area');
        if (!area) return;
        area.innerHTML = '<div class="funfact-loading"><span class="spinner dark"></span> 載入趣味知識...</div>';
        try {
            const res = await fetch('/api/funfact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: words[idx].en, zh: words[idx].zh })
            });
            if (!res.ok) throw new Error('API error');
            const data = await res.json();
            let html = `<div class="funfact-box">`;
            html += `<div class="funfact-title">${data.emoji || '💡'} ${data.title || 'Did you know?'}</div>`;
            if (data.facts?.length) {
                html += data.facts.map(f => `<div class="funfact-item"><span class="ff-icon">${f.icon||'•'}</span><div><div class="ff-text">${f.text}</div><div class="ff-zh">${f.zh||''}</div></div></div>`).join('');
            }
            if (data.related?.length) {
                html += `<div class="funfact-related">${data.related.map(r => `<span class="fr-tag" onclick="speak('${esc(r.word)}')">${r.emoji||''} ${r.word} <span class="fr-zh">${r.zh||''}</span></span>`).join('')}</div>`;
            }
            if (data.tip) {
                html += `<div class="funfact-tip">💡 ${data.tip}</div>`;
            }
            html += `</div>`;
            area.innerHTML = html;
        } catch (e) {
            area.innerHTML = '';
        }
    }

    function giveHint() {
        const inputs = document.querySelectorAll('#input-area input');
        for (const inp of inputs) {
            if (!inp.classList.contains('correct')) {
                inp.value = inp.dataset.letter; inp.classList.add('correct');
                let next = inp.nextElementSibling;
                while(next && next.tagName !== 'INPUT') next = next.nextElementSibling;
                if (next) next.focus(); break;
            }
        }
        if ([...inputs].every(i => i.classList.contains('correct'))) {
            document.getElementById('success-msg').classList.remove('hidden');
            speak(words[currentIdx].en);
        }
    }

    function updateProgress() {
        const n = words.length, c = n > 0 ? currentIdx + 1 : 0;
        const pct = n > 0 ? Math.round(c / n * 100) : 0;
        document.getElementById('progress-text').textContent = `${c} / ${n}`;
        document.getElementById('progress-pct').textContent = pct + '%';
        document.getElementById('progress-fill').style.width = pct + '%';
    }

    function updateNavBtns() {
        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').textContent = currentIdx >= words.length - 1 ? '🏁 完成' : '下一個 ▶';
    }

    function prevWord() { if(currentIdx > 0){ currentIdx--; renderPractice(); } }
    function nextWord() {
        if (currentIdx < words.length - 1) { currentIdx++; renderPractice(); }
        else if (words.length > 0) {
            document.getElementById('word-card').innerHTML = `<div class="completion-screen"><h2>🏆 全部溫習完畢！</h2><p>你太棒了！繼續努力！</p><button class="restart-btn" onclick="currentIdx=0;renderPractice()">🔄 重新開始</button></div>`;
            document.getElementById('practice-nav').style.display = 'none';
        }
    }

    /* ===== Speech ===== */
    function speak(text) {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.8;
        const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
        if (v) u.voice = v;
        speechSynthesis.speak(u);
    }
    if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

    /* ===== Details ===== */
    function renderDetails() {
        const container = document.getElementById('details-content');
        if (!words.length) { container.innerHTML = '<div class="no-details">沒有生字</div>'; return; }
        const w = words[currentIdx], d = w.details;
        let html = `<div class="details-header">
            <div class="emoji">${w.emoji||'📝'}</div>
            <div class="en" onclick="speak('${esc(w.en)}')">${w.en} 🔊</div>
            <div class="zh">${w.zh||''}</div>
            ${d?.partOfSpeech ? `<span class="pos">${d.partOfSpeech}</span>` : ''}
        </div>`;
        if (d) {
            if (d.forms?.length) html += `<div class="details-section"><h3>📝 Word Forms</h3><div>${d.forms.map(f=>`<span class="detail-tag" onclick="speak('${esc(f.form)}')">${f.form} <span class="tag-zh">${f.label||''}</span></span>`).join('')}</div></div>`;
            if (d.synonyms?.length) html += `<div class="details-section"><h3>🔄 Synonyms 同義詞</h3><div>${d.synonyms.map(s=>`<span class="detail-tag" onclick="speak('${esc(s.word||s)}')">${s.word||s} <span class="tag-zh">${s.zh||''}</span></span>`).join('')}</div></div>`;
            if (d.antonyms?.length) html += `<div class="details-section"><h3>↔️ Antonyms 反義詞</h3><div>${d.antonyms.map(a=>`<span class="detail-tag" onclick="speak('${esc(a.word||a)}')">${a.word||a} <span class="tag-zh">${a.zh||''}</span></span>`).join('')}</div></div>`;
            if (d.related?.length) html += `<div class="details-section"><h3>🔗 Related 相關詞彙</h3><div>${d.related.map(r=>`<span class="detail-tag" onclick="speak('${esc(r.word||r)}')">${r.word||r} <span class="tag-zh">${r.zh||''}</span></span>`).join('')}</div></div>`;
            if (d.example) html += `<div class="details-section"><h3>💬 Example 例句</h3><div class="detail-example">${d.example}${d.exampleZh?`<div class="example-zh">${d.exampleZh}</div>`:''}</div></div>`;
        } else {
            html += `<div class="no-details" style="padding:24px"><p>尚未載入詞彙詳情</p><button class="fetch-btn" onclick="fetchDetails(${currentIdx})">✨ AI 生成詳情</button></div>`;
        }
        html += `<div class="details-nav"><button onclick="if(currentIdx>0){currentIdx--;renderDetails()}" ${currentIdx===0?'disabled':''}>◀ Prev</button><span class="counter">${currentIdx+1} / ${words.length}</span><button onclick="if(currentIdx<words.length-1){currentIdx++;renderDetails()}" ${currentIdx>=words.length-1?'disabled':''}>Next ▶</button></div>`;
        container.innerHTML = html;
    }

    async function fetchDetails(idx) {
        toast('⏳ Loading details...', 'info');
        try {
            const res = await fetch('/api/details', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: words[idx].en })
            });
            if (!res.ok) throw new Error('API error: ' + res.status);
            words[idx].details = await res.json();
            if (isAdmin) await saveWordsToServer();
            renderDetails();
            toast('✅ 詞彙詳情已載入');
        } catch (e) { toast('載入失敗: ' + e.message, 'error'); }
    }

    /* ===== Manage ===== */
    function renderManageList() {
        document.getElementById('word-count').textContent = `共 ${words.length} 個生字`;
        document.getElementById('word-list-area').innerHTML = words.map((w, i) => `
            <div class="word-row">
                <span class="wr-em">${w.emoji||'📝'}</span>
                <span class="wr-en">${w.en}</span>
                <span class="wr-zh">${w.zh||'-'}</span>
                ${isAdmin ? `<button class="wr-del" onclick="deleteWord(${i})" title="Delete">🗑</button>` : ''}
            </div>`).join('');
    }

    async function addWord() {
        const inp = document.getElementById('add-word-input');
        const en = inp.value.trim();
        if (!en) return;
        inp.value = '';
        toast('⏳ Adding: ' + en, 'info');
        try {
            const res = await fetch('/api/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ word: en })
            });
            const t = res.ok ? await res.json() : { zh: '', emoji: '📝' };
            words.push({ en, zh: t.zh, emoji: t.emoji });
            if (await saveWordsToServer()) {
                renderManageList();
                toast(`✅ Added: ${en} (${t.zh} ${t.emoji})`);
            }
        } catch (e) {
            words.push({ en, zh: '', emoji: '📝' });
            await saveWordsToServer();
            renderManageList();
            toast(`⚠️ Added "${en}" without translation`, 'error');
        }
    }

    async function batchAdd() {
        const textarea = document.getElementById('batch-input');
        const lines = textarea.value.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) return;
        toast(`⏳ Adding ${lines.length} words...`, 'info');
        for (const en of lines) {
            try {
                const res = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ word: en }) });
                const t = res.ok ? await res.json() : { zh: '', emoji: '📝' };
                words.push({ en, zh: t.zh, emoji: t.emoji });
            } catch { words.push({ en, zh: '', emoji: '📝' }); }
        }
        await saveWordsToServer();
        renderManageList();
        textarea.value = '';
        toast(`✅ Added ${lines.length} words`);
    }

    async function retranslateAll() {
        if (!confirm(`Re-translate all ${words.length} words?`)) return;
        toast(`⏳ Translating...`, 'info');
        let done = 0;
        for (let i = 0; i < words.length; i++) {
            try {
                const res = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ word: words[i].en }) });
                if (res.ok) { const t = await res.json(); if (t.zh) words[i].zh = t.zh; if (t.emoji) words[i].emoji = t.emoji; done++; }
            } catch {}
        }
        await saveWordsToServer();
        renderManageList();
        renderPractice();
        toast(`✅ Translated ${done} words`);
    }

    async function deleteWord(idx) {
        if (!confirm(`Delete "${words[idx].en}"?`)) return;
        words.splice(idx, 1);
        if (currentIdx >= words.length && currentIdx > 0) currentIdx = words.length - 1;
        await saveWordsToServer();
        renderManageList();
        toast('🗑 Deleted');
    }

    function exportWords() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' }));
        a.download = 'hh-dictation-words.json'; a.click();
    }

    async function importWords(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
            try {
                const imported = JSON.parse(reader.result);
                if (!Array.isArray(imported)) throw new Error('Invalid');
                words = imported; currentIdx = 0;
                await saveWordsToServer();
                renderManageList(); renderPractice();
                toast(`📥 Imported ${words.length} words`);
            } catch (err) { toast('Import failed: ' + err.message, 'error'); }
        };
        reader.readAsText(file); e.target.value = '';
    }

    /* ===== Dictation Test ===== */
    function renderTestStart() {
        document.getElementById('test-history-card').style.display = '';
        renderTestHistory();
        document.getElementById('test-content').innerHTML = `
            <div class="test-start">
                <h2>📋 正式默書</h2>
                <p>共 ${words.length} 個生字<br>沒有提示，計時計分</p>
                <button class="test-start-btn" onclick="startTest()" ${words.length===0?'disabled':''}>🚀 開始默書</button>
            </div>`;
    }

    function startTest() {
        testActive = true;
        testIdx = 0;
        testAnswers = words.map(() => ({ typed: '', correct: false }));
        testSeconds = 0;
        document.getElementById('test-history-card').style.display = 'none';
        testTimer = setInterval(() => {
            testSeconds++;
            if (testSeconds >= 1800) {
                clearInterval(testTimer);
                toast('⏰ 時間到！30分鐘已過', 'error');
                finishTest();
                return;
            }
            const el = document.getElementById('test-clock');
            if (el) el.textContent = formatTime(testSeconds);
        }, 1000);
        renderTestWord();
    }

    function formatTime(s) {
        if (s >= 1800) return '⏰ Over 30 mins';
        const m = Math.floor(s / 60);
        return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
    }

    function renderTestWord() {
        if (testIdx >= words.length) { finishTest(); return; }
        const w = words[testIdx];
        document.getElementById('test-content').innerHTML = `
            <div class="test-timer">
                <span class="timer-progress">第 ${testIdx+1} / ${words.length} 題</span>
                <span class="timer-clock" id="test-clock">⏱ ${formatTime(testSeconds)}</span>
            </div>
            <div class="word-card-inner">
                <div class="card-label" style="color:#dc2626">正式默書</div>
                <div><div class="word-emoji">${w.emoji||'📝'}</div><div class="word-zh">${w.zh||'?'}</div></div>
                <button class="speak-btn" style="background:linear-gradient(135deg,#ef4444,#dc2626)" onclick="speak('${esc(w.en)}')">🔊 聽發音</button>
                <div class="input-area" id="test-input-area">${genTestInputs(w.en)}</div>
            </div>
            <div class="nav-buttons" style="border-top:1px solid var(--border)">
                <button class="test-skip-btn" onclick="skipTestWord()">跳過 ▶</button>
                <button class="test-submit-btn" onclick="submitTestWord()">提交 ✓</button>
            </div>`;
        setTimeout(() => { const f = document.querySelector('#test-input-area input'); if(f) f.focus(); }, 200);
    }

    function genTestInputs(word) {
        return word.split('').map(c => c === ' '
            ? '<div class="word-space"></div>'
            : `<input type="text" maxlength="1" class="letter-input" data-letter="${c.toLowerCase()}" oninput="testCheckInput(this)" onkeydown="handleKey(event,this)" style="border-color:var(--border)">`
        ).join('');
    }

    function testCheckInput(el) {
        // No feedback in test mode - just auto-advance to next input
        if (el.value) {
            let next = el.nextElementSibling;
            while(next && next.tagName !== 'INPUT') next = next.nextElementSibling;
            if (next) next.focus();
        }
    }

    function submitTestWord() {
        const inputs = document.querySelectorAll('#test-input-area input');
        const typed = [...inputs].map(i => i.value.toLowerCase() || '').join('');
        const expected = words[testIdx].en.replace(/ /g, '').toLowerCase();
        testAnswers[testIdx] = { typed, correct: typed === expected };
        testIdx++;
        renderTestWord();
    }

    function skipTestWord() {
        testAnswers[testIdx] = { typed: '', correct: false };
        testIdx++;
        renderTestWord();
    }

    function finishTest() {
        clearInterval(testTimer);
        testActive = false;
        const total = words.length;
        const correct = testAnswers.filter(a => a.correct).length;
        const pct = Math.round(correct / total * 100);
        const scoreClass = pct === 100 ? 'perfect' : pct >= 60 ? 'good' : 'poor';

        // Build error details
        let errorsHtml = '';
        const wrongWords = [];
        words.forEach((w, i) => {
            if (!testAnswers[i].correct) {
                wrongWords.push(w.en);
                const typed = testAnswers[i].typed;
                const letters = w.en.replace(/ /g, '').toLowerCase().split('');
                const typedArr = typed.split('');
                let letterHtml = '';
                let charIdx = 0;
                for (const c of w.en) {
                    if (c === ' ') {
                        letterHtml += '<span class="el space"></span>';
                    } else {
                        const t = typedArr[charIdx] || '';
                        const isOk = t === c.toLowerCase();
                        letterHtml += `<span class="el ${isOk ? 'ok' : 'wrong'}">${t || '?'}</span>`;
                        if (!isOk) letterHtml += `<span class="el correct-show">${c}</span>`;
                        charIdx++;
                    }
                }
                errorsHtml += `<div class="error-item">
                    <div class="error-word-row">
                        <strong>${w.en}</strong>
                        <span class="err-zh">${w.zh||''}</span>
                    </div>
                    <div class="error-letters">${letterHtml}</div>
                </div>`;
            }
        });

        // Save to history
        const record = {
            date: new Date().toISOString(),
            total, correct, pct,
            time: testSeconds,
            wrongWords
        };
        testHistory.unshift(record);
        if (testHistory.length > 50) testHistory = testHistory.slice(0, 50);
        localStorage.setItem('hh_test_history', JSON.stringify(testHistory));

        document.getElementById('test-content').innerHTML = `
            <div class="result-score" style="background:linear-gradient(135deg,#fef2f2,#fff1f2);padding:28px 20px">
                <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:8px">📋 默書成績</div>
                <div class="big-score ${scoreClass}">${pct}%</div>
                <div class="score-label">${correct} / ${total} 正確</div>
            </div>
            <div class="result-stat">
                <div class="stat-box"><div class="stat-val" style="color:var(--success)">${correct}</div><div class="stat-lbl">✅ 正確</div></div>
                <div class="stat-box"><div class="stat-val" style="color:var(--danger)">${total - correct}</div><div class="stat-lbl">❌ 錯誤</div></div>
                <div class="stat-box"><div class="stat-val">${formatTime(testSeconds)}</div><div class="stat-lbl">⏱ 用時</div></div>
            </div>
            ${errorsHtml ? `<div style="padding:12px 20px;background:#f8fafc;border-top:1px solid var(--border)"><h3 style="font-size:13px;font-weight:700;color:var(--danger)">❌ 錯誤分析 (${total - correct} 個)</h3></div>${errorsHtml}` : '<div style="padding:24px;text-align:center;color:var(--success);font-weight:700;font-size:18px">🎉 全部正確！太棒了！</div>'}
            <div style="padding:16px;text-align:center;border-top:1px solid var(--border)">
                <button class="restart-btn" onclick="renderTestStart()" style="background:linear-gradient(135deg,#ef4444,#dc2626)">📋 再做一次</button>
                <button class="restart-btn" onclick="switchView('practice')" style="background:var(--primary);margin-left:8px">📝 去練習</button>
            </div>`;
        document.getElementById('test-history-card').style.display = '';
        renderTestHistory();
    }

    function renderTestHistory() {
        const list = document.getElementById('test-history-list');
        if (!testHistory.length) {
            list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-3);font-size:13px">尚無默書記錄</div>';
            return;
        }
        list.innerHTML = testHistory.slice(0, 20).map(h => {
            const d = new Date(h.date);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const cls = h.pct === 100 ? 'perfect' : h.pct >= 60 ? 'good' : 'poor';
            return `<div class="history-item">
                <div><div class="hi-date">${dateStr}</div><div class="hi-time">⏱ ${formatTime(h.time)} · ${h.total} 字</div></div>
                <div class="hi-score ${cls}">${h.pct}% (${h.correct}/${h.total})</div>
            </div>`;
        }).join('');
    }

    /* ===== Toast ===== */
    function toast(msg, type = 'success') {
        const t = document.createElement('div');
        t.className = 'toast ' + type; t.textContent = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
    }

    window.onload = init;
    </script>
</body>
</html>
